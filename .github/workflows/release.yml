name: release

# Tag a version (e.g. `git tag v1.0.0 && git push --tags`) to build the macOS binaries and attach
# them to the GitHub Release. machineline is macOS-only, so there are no Linux/Windows artifacts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        # cd into the output dir first so the archive holds a *bare* `machineline` (the installer
        # extracts it directly — no nested target/.../release/ path).
        run: |
          name="machineline-${{ matrix.target }}"
          cd "target/${{ matrix.target }}/release"
          tar -czf "$GITHUB_WORKSPACE/${name}.tar.gz" machineline

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: machineline-${{ matrix.target }}.*
          if-no-files-found: error

  # A single publish job (after both builds) so the release is created once — no concurrent
  # action-gh-release calls racing to create the same tag's release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
