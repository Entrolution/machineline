[package]
name = "machineline"
version = "0.1.0"
edition = "2021"
description = "Local-machine health on the Claude Code status line: CPU throttle/speed-limit, load, utilization, memory pressure, swap, temperature, hottest process and power — read from the OS, cached off the render path."
license = "MIT"
repository = "https://github.com/Entrolution/machineline"
readme = "README.md"

[[bin]]
name = "machineline"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the user's existing settings.json key order on install.
serde_json = { version = "1", features = ["preserve_order"] }

# Small, self-contained release binary for distribution. The OS is read via libSystem
# (mach/libc), the IOKit framework (SMC temperature) and a few stock CLIs (pmset/vm_stat/ps),
# so deps stay limited to serde — matching quotaline and vastline.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
